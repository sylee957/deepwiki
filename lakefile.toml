name = "deepwiki"
defaultTargets = ["DeepWiki", "Sources"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#v4.31.0"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.31.0"

# Verso (prose-only, Mathlib-free) — powers the standalone Risch-algorithm
# tutorial Manual. Pinned to the toolchain. The CLAUDE.md "no Verso" rule is
# about the LIBRARY (chapters stay plain Lean + doc-gen4); this tutorial is a
# separate, intentional target kept out of `defaultTargets` like `wiki`/`tlts`.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.31.0"

[[lean_lib]]
name = "DeepWiki"

[[lean_lib]]
name = "Sources"

# Graph-RAG tooling — kept out of `defaultTargets` so the warning-/sorry-free
# `lake build` gate over the math library is untouched. Build with `lake build wiki`.
[[lean_lib]]
name = "WikiRAG"
srcDir = "tools"

[[lean_exe]]
name = "wiki"
srcDir = "tools"
root = "WikiRAG.Main"

# Verified timed model checker CLI (DeepWiki.ReactiveSystems). Out of `defaultTargets`
# like the RAG tooling. Build with `lake build tlts`; run with `lake exe tlts`.
[[lean_lib]]
name = "TltsCheck"
srcDir = "tools"

[[lean_exe]]
name = "tlts"
srcDir = "tools"
root = "TltsCheck.Main"

# Executable (min,plus) calculator over UPP sequences (DeepWiki.NetworkCalculus.UppSequence).
# Out of `defaultTargets` like the other tooling. Build with `lake build minplus`; run `lake exe minplus`.
[[lean_lib]]
name = "MinPlusCalc"
srcDir = "tools"

[[lean_exe]]
name = "minplus"
srcDir = "tools"
root = "MinPlusCalc.Main"

# Standalone Verso Manual tutorial for the Risch algorithms (prose-only).
# Out of `defaultTargets` like the other tooling — the math gate is untouched.
# Build with `lake build Tutorial`; render with `lake exe tutorial --output _out`.
[[lean_lib]]
name = "Tutorial"
# All `Tutorial.*` submodules (no `Tutorial.lean` root file); `Main` is the exe root.
globs = ["Tutorial.+"]

[[lean_exe]]
name = "tutorial"
root = "Tutorial.Main"
