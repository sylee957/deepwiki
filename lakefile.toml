name = "deepwiki"
defaultTargets = ["DeepWiki", "Sources"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#v4.32.1"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.32.0"

[[lean_lib]]
name = "DeepWiki"

[[lean_lib]]
name = "Sources"

# Graph-RAG tooling — kept out of `defaultTargets` so the warning-/sorry-free
# `lake build` gate over the math library is untouched. Build with `lake build wiki`.
[[lean_lib]]
name = "WikiRAG"
srcDir = "tools"

[[lean_exe]]
name = "wiki"
srcDir = "tools"
root = "WikiRAG.Main"

# Verified timed model checker CLI (DeepWiki.ReactiveSystems). Out of `defaultTargets`
# like the RAG tooling. Build with `lake build tlts`; run with `lake exe tlts`.
[[lean_lib]]
name = "TltsCheck"
srcDir = "tools"
globs = ["TltsCheck.+"]

[[lean_exe]]
name = "tlts"
srcDir = "tools"
root = "TltsCheck.Main"

# Executable (min,plus) calculator over UPP sequences (DeepWiki.NetworkCalculus.UppSequence).
# Out of `defaultTargets` like the other tooling. Build with `lake build minplus`; run `lake exe minplus`.
[[lean_lib]]
name = "MinPlusCalc"
srcDir = "tools"
globs = ["MinPlusCalc.+"]

[[lean_exe]]
name = "minplus"
srcDir = "tools"
root = "MinPlusCalc.Main"

# Verified rational-integration CLI (DeepWiki.CAlgebra Frontend). Out of `defaultTargets`
# like the other tooling. Build with `lake build integrate`; run `lake exe integrate "1/(x^2-1)"`.
[[lean_lib]]
name = "RatIntegrate"
srcDir = "tools"
globs = ["RatIntegrate.+"]

[[lean_exe]]
name = "integrate"
srcDir = "tools"
root = "RatIntegrate.Main"
